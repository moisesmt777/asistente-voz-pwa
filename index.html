<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1c" />
  <meta name="description" content="Asistente virtual por voz, offline-first, con IA en el dispositivo." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Asistente" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Asistente de Voz</title>
</head>
<body data-state="idle">
  <div id="wallpaper" aria-hidden="true"></div>

  <div id="app">
    <!-- ====== Barra superior ====== -->
    <header id="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
        </div>
        <div>
          <div class="brand-name">Asistente</div>
          <div class="brand-sub" id="brandSub">Iniciando…</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="netChip" class="chip" title="Estado de conexión">◍ Offline</button>
        <button id="btnChat" class="icon-btn" title="Conversación" aria-label="Conversación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button id="btnSettings" class="icon-btn" title="Ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- ====== Home: cuadrícula de iconos (render dinámico) ====== -->
    <main id="home">
      <div id="tiles" class="tiles" aria-label="Tus espacios"></div>
    </main>

    <!-- ====== Núcleo del asistente (respuesta + orbe + estado) ====== -->
    <section id="assistant">
      <div id="replyCard" class="reply-card" role="status" aria-live="polite" hidden></div>
      <div id="orb" data-state="idle" aria-hidden="true">
        <span class="orb-core"></span>
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
      </div>
      <div id="stateLabel">Toca el micrófono para hablar</div>
      <div id="liveTranscript"></div>
    </section>

    <!-- ====== Controles ====== -->
    <footer id="controls">
      <div class="input-row">
        <input id="textInput" class="text-input" type="text"
               placeholder="Escribe o toca el micrófono…" autocomplete="off" enterkeyhint="send" />
        <button id="btnSend" class="icon-btn" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="mic-row">
        <button id="btnWake" class="pill-btn" title="Palabra de activación">
          <span class="dot"></span> Wake word
        </button>
        <button id="btnMic" class="mic-btn" aria-label="Hablar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
        </button>
        <button id="btnStop" class="pill-btn" title="Detener voz">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Silenciar
        </button>
      </div>
    </footer>
  </div>

  <!-- ====== Vista: Mis cosas (skills) ====== -->
  <aside id="panel" class="view">
    <div class="sheet-head">
      <button class="icon-btn" data-close="panel" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h2 id="panelTitle">Tareas</h2>
    </div>
    <div class="tabs" id="panelTabs">
      <button class="tab on" data-tab="tareas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Tareas
      </button>
      <button class="tab" data-tab="notas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Notas
      </button>
      <button class="tab" data-tab="eventos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Agenda
      </button>
      <button class="tab" data-tab="alarmas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Alarmas
      </button>
      <button class="tab" data-tab="media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Fotos
      </button>
    </div>
    <div class="sheet-body" id="panelBody"></div>
  </aside>

  <!-- ====== Vista: Conversación ====== -->
  <aside id="chat" class="view">
    <div class="sheet-head">
      <button class="icon-btn" data-close="chat" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h2>Conversación</h2>
    </div>
    <div class="sheet-body" id="conversation" aria-live="polite"></div>
  </aside>

  <!-- ====== Vista: Ajustes ====== -->
  <aside id="settings" class="view">
    <div class="sheet-head">
      <button class="icon-btn" data-close="settings" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h2>Ajustes</h2>
    </div>
    <div class="sheet-body" id="settingsBody"><!-- render dinámico --></div>
  </aside>

  <div id="toasts"></div>

  <!-- Punto de entrada (ES Modules) -->
  <script type="module" src="js/app.js"></script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(reg => console.info('[PWA] Service Worker registrado:', reg.scope))
          .catch(err => console.warn('[PWA] Fallo al registrar SW:', err));
      });
    }
  </script>
</body>
</html>
