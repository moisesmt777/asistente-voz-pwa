<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1c" />
  <meta name="description" content="Asistente virtual por voz, offline-first, con IA en el dispositivo." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Asistente" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Asistente de Voz</title>
</head>
<body data-state="idle">
  <div id="wallpaper" aria-hidden="true"></div>

  <div id="app">
    <!-- ====== Barra superior ====== -->
    <header id="topbar">
      <div class="brand">
        <div class="logo">🎙️</div>
        <div>
          <div class="brand-name">Asistente</div>
          <div class="brand-sub" id="brandSub">Iniciando…</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="netChip" class="chip" title="Estado de conexión">◍ Offline</button>
        <button id="btnPanel" class="icon-btn" title="Mis cosas" aria-label="Mis cosas">🗂️</button>
        <button id="btnSettings" class="icon-btn" title="Ajustes" aria-label="Ajustes">⚙️</button>
      </div>
    </header>

    <!-- ====== Conversación ====== -->
    <main id="conversation" aria-live="polite"></main>

    <!-- ====== Núcleo del asistente (orbe + estado) ====== -->
    <section id="assistant">
      <div id="orb" data-state="idle" aria-hidden="true">
        <span class="orb-core"></span>
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
      </div>
      <div id="stateLabel">Toca el micrófono para hablar</div>
      <div id="liveTranscript"></div>
    </section>

    <!-- ====== Controles ====== -->
    <footer id="controls">
      <div class="input-row">
        <input id="textInput" class="text-input" type="text"
               placeholder="Escribe o toca 🎙️…" autocomplete="off" enterkeyhint="send" />
        <button id="btnSend" class="icon-btn" aria-label="Enviar">➤</button>
      </div>
      <div class="mic-row">
        <button id="btnWake" class="pill-btn" title="Palabra de activación">
          <span class="dot"></span> Wake word
        </button>
        <button id="btnMic" class="mic-btn" aria-label="Hablar">🎙️</button>
        <button id="btnStop" class="pill-btn" title="Detener voz">■ Silenciar</button>
      </div>
    </footer>
  </div>

  <!-- ====== Panel lateral: Mis cosas (skills) ====== -->
  <div id="panelOverlay" class="overlay"></div>
  <aside id="panel" class="sheet">
    <div class="sheet-head">
      <h2>Mis cosas</h2>
      <button class="icon-btn" data-close="panel">✕</button>
    </div>
    <div class="tabs" id="panelTabs">
      <button class="tab on" data-tab="tareas">✅ Tareas</button>
      <button class="tab" data-tab="notas">📝 Notas</button>
      <button class="tab" data-tab="eventos">📅 Agenda</button>
      <button class="tab" data-tab="alarmas">⏰ Alarmas</button>
    </div>
    <div class="sheet-body" id="panelBody"></div>
  </aside>

  <!-- ====== Ajustes ====== -->
  <div id="settingsOverlay" class="overlay"></div>
  <aside id="settings" class="sheet">
    <div class="sheet-head">
      <h2>Ajustes</h2>
      <button class="icon-btn" data-close="settings">✕</button>
    </div>
    <div class="sheet-body" id="settingsBody"><!-- render dinámico --></div>
  </aside>

  <div id="toasts"></div>

  <!-- Punto de entrada (ES Modules) -->
  <script type="module" src="js/app.js"></script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(reg => console.info('[PWA] Service Worker registrado:', reg.scope))
          .catch(err => console.warn('[PWA] Fallo al registrar SW:', err));
      });
    }
  </script>
</body>
</html>
